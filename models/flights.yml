version: 2

models:
  - name: clean_dim_airline
    columns:
      - name: airline_id
        tests:
          - not_null
          - unique
      - name: airline_name
        tests:
          - not_null
          - unique

  - name: clean_dim_airport
    columns:
      - name: airport_code
        tests:
          - not_null
          - unique
      - name: airport_name
        tests:
          - not_null

  - name: aggregate_flights
    description: >
      This model aggregates flight data from the `join_flights` model, calculating metrics like
      average delays, counts of total/cancelled/diverted flights, and the percentage of delayed flights.
      It is grouped by airline name, origin/destination airport, and binned distance category.
    columns:
      - name: airline_name
        description: "Name of the operating airline"

      - name: origin_airport_name
        description: "Full name of the origin airport"

      - name: dest_airport_name
        description: "Full name of the destination airport"

      - name: distance_category
        description: >
          Binned flight distance group, with values like:
          'Short Flight (<250 mi)', 'Medium Flight (250-749 mi)', 
          'Long Flight (750-1499 mi)', 'Ultra Long Flight (1500+ mi)', or 'Unknown'

      - name: total_flights
        description: "Total number of flights (non-cancelled, non-diverted) in this group"

      - name: avg_dep_delay
        description: "Average departure delay in minutes for valid (non-cancelled, non-diverted) flights"
        
      - name: avg_arr_delay
        description: "Average arrival delay in minutes for valid (non-cancelled, non-diverted) flights"

      - name: avg_distance
        description: "Average flight distance (in miles) for the grouped flights"

      - name: avg_air_time
        description: "Average air time (in minutes) for the grouped flights"

      - name: percent_delayed_flights
        description: >
          Percentage of non-cancelled, non-diverted flights in this group that were delayed 
          more than 15 minutes at arrival

      - name: cancelled_flights
        description: "Count of cancelled flights in this group (excluded from average calculations)"

      - name: diverted_flights
        description: "Count of diverted flights in this group (excluded from average calculations)"